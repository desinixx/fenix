<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FENIX Admin Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="icon" href="favicon.png" type="image/png">

<style>

:root{
    --bg:#050505;
    --card:#111111;
    --border:rgba(255,255,255,0.08);
    --gold:#f2d95c;
    --blue:#41a8e8;
    --white:#ffffff;
    --muted:rgba(255,255,255,0.7);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Outfit',sans-serif;
}

body{
    background:var(--bg);
    color:var(--white);
    overflow:hidden;
}

/* LOGIN */

#login-screen{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#000;
    z-index:100;
}

.login-box{
    width:400px;
    max-width:90%;
    background:rgba(255,255,255,0.03);
    border:1px solid var(--border);
    border-radius:24px;
    padding:45px;
    text-align:center;
    backdrop-filter:blur(12px);
}

.login-box img{
    height:50px;
    margin-bottom:25px;
}

.login-box h2{
    margin-bottom:25px;
    color:var(--gold);
}

.login-input{
    width:100%;
    padding:16px;
    border-radius:14px;
    border:1px solid var(--border);
    background:#0b0b0b;
    color:white;
    outline:none;
    margin-bottom:20px;
    text-align:center;
    font-size:16px;
}

.btn-login{
    width:100%;
    padding:15px;
    border:none;
    border-radius:40px;
    background:linear-gradient(45deg,var(--blue),var(--gold));
    color:#000;
    font-weight:700;
    cursor:pointer;
}

.error-msg{
    color:#ff4d4d;
    margin-top:15px;
    opacity:0;
}

/* DASHBOARD */

#dashboard{
    display:none;
    height:100vh;
    flex-direction:column;
}

nav{
    padding:20px 5%;
    border-bottom:1px solid var(--border);
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:28px;
    font-weight:800;
    color:var(--gold);
}

.nav-actions{
    display:flex;
    gap:15px;
}

.btn-action{
    padding:10px 18px;
    border-radius:30px;
    border:1px solid var(--border);
    background:rgba(255,255,255,0.03);
    color:white;
    cursor:pointer;
}

.btn-logout{
    border-color:#ff4d4d;
    color:#ff4d4d;
}

.dashboard-content{
    padding:40px 5%;
    overflow:auto;
    flex:1;
}

.header-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
}

.search-bar{
    position:relative;
    width:300px;
}

.search-bar input{
    width:100%;
    padding:14px 14px 14px 45px;
    border-radius:40px;
    border:1px solid var(--border);
    background:#111;
    color:white;
    outline:none;
}

.search-bar i{
    position:absolute;
    left:16px;
    top:50%;
    transform:translateY(-50%);
}

.table-container{
    background:rgba(255,255,255,0.03);
    border:1px solid var(--border);
    border-radius:18px;
    overflow:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#0d0d0d;
    color:var(--gold);
    padding:18px;
    text-align:left;
    font-size:14px;
}

td{
    padding:18px;
    border-top:1px solid var(--border);
    color:var(--muted);
}

tr:hover{
    background:rgba(255,255,255,0.02);
}

.badge{
    background:rgba(65,168,232,0.15);
    color:var(--blue);
    padding:5px 12px;
    border-radius:20px;
    font-size:13px;
    font-weight:600;
}

.btn-del{
    padding:8px 10px;
    border:none;
    border-radius:10px;
    background:#ff4d4d20;
    color:#ff4d4d;
    cursor:pointer;
}

.data-loader{
    padding:50px;
    text-align:center;
    display:none;
}

@media(max-width:768px){

    .header-row{
        flex-direction:column;
        gap:20px;
        align-items:flex-start;
    }

    .search-bar{
        width:100%;
    }

}

</style>
</head>

<body>

<!-- LOGIN -->

<div id="login-screen">

    <div class="login-box" id="loginBox">

        <img src="logo.png" onerror="this.src='https://placehold.co/160x50/000/fff?text=FENIX'">

        <h2>Admin Login</h2>

        <input 
            type="password"
            id="adminPassword"
            class="login-input"
            placeholder="Enter Password"
        >

        <button class="btn-login" onclick="verifyLogin()">
            Access Dashboard
        </button>

        <div class="error-msg" id="errorMsg">
            Wrong Password
        </div>

    </div>

</div>

<!-- DASHBOARD -->

<div id="dashboard">

    <nav>

        <div class="logo">
            FENIX
        </div>

        <div class="nav-actions">

            <button class="btn-action" onclick="fetchOrders()">
                <i class="ph ph-arrows-clockwise"></i>
                Refresh
            </button>

            <button class="btn-action" onclick="exportCSV()">
                <i class="ph ph-download-simple"></i>
                Export
            </button>

            <button class="btn-action btn-logout" onclick="logout()">
                Logout
            </button>

        </div>

    </nav>

    <div class="dashboard-content">

        <div class="header-row">

            <h1>Orders Dashboard</h1>

            <div class="search-bar">

                <i class="ph ph-magnifying-glass"></i>

                <input 
                    type="text"
                    id="searchInput"
                    placeholder="Search..."
                    onkeyup="filterTable()"
                >

            </div>

        </div>

        <div class="table-container">

            <div class="data-loader" id="dataLoader">
                Loading Orders...
            </div>

            <table>

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>Date</th>
                        <th>Name</th>
                        <th>Contact</th>
                        <th>Service</th>
                        <th>Message</th>
                        <th>Action</th>
                    </tr>

                </thead>

                <tbody id="tableBody"></tbody>

            </table>

        </div>

    </div>

</div>

<script>

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbw_3TzcCA3a1O4nDr_XNc7B3OFnUS7U27deJHIxKG7CshwhqsjwOHk0Oa7aiOv0b8ei/exec";

const CORRECT_PASS = "falaq12345";

let allOrders = [];

// AUTO LOGIN

if(localStorage.getItem("fenix_admin_auth")==="true"){
    showDashboard();
}

// LOGIN

function verifyLogin(){

    const pass =
    document.getElementById("adminPassword").value;

    if(pass === CORRECT_PASS){

        localStorage.setItem(
            "fenix_admin_auth",
            "true"
        );

        showDashboard();

    } else {

        document.getElementById(
            "errorMsg"
        ).style.opacity = "1";

    }

}

// ENTER KEY

document.getElementById(
    "adminPassword"
).addEventListener("keypress",function(e){

    if(e.key==="Enter"){
        verifyLogin();
    }

});

// SHOW DASHBOARD

function showDashboard(){

    document.getElementById(
        "login-screen"
    ).style.display = "none";

    document.getElementById(
        "dashboard"
    ).style.display = "flex";

    fetchOrders();

}

// LOGOUT

function logout(){

    localStorage.removeItem(
        "fenix_admin_auth"
    );

    location.reload();

}

// FETCH ORDERS

async function fetchOrders(){

    const loader =
    document.getElementById("dataLoader");

    const tbody =
    document.getElementById("tableBody");

    loader.style.display = "block";

    tbody.innerHTML = "";

    try{

        const response = await fetch(
            `${APPS_SCRIPT_URL}?action=get`
        );

        const result = await response.json();

        if(result.success){

            allOrders = result.data;

            renderTable(allOrders);

        } else {

            tbody.innerHTML =
            `<tr>
                <td colspan="7">
                    Failed to load data
                </td>
            </tr>`;

        }

    } catch(error){

        console.log(error);

        tbody.innerHTML =
        `<tr>
            <td colspan="7">
                Network Error
            </td>
        </tr>`;

    } finally {

        loader.style.display = "none";

    }

}

// RENDER TABLE

function renderTable(data){

    const tbody =
    document.getElementById("tableBody");

    tbody.innerHTML = "";

    if(data.length===0){

        tbody.innerHTML =
        `<tr>
            <td colspan="7">
                No Orders Found
            </td>
        </tr>`;

        return;
    }

    data.forEach(order=>{

        const row = document.createElement("tr");

        row.innerHTML = `

        <td style="color:white;font-weight:700;">
            ${order.ID || "-"}
        </td>

        <td>
            ${order.Date || "-"}
        </td>

        <td>
            ${order.Name || "-"}
        </td>

        <td>
            ${order.Email || "-"}<br>
            <small>${order.Phone || "-"}</small>
        </td>

        <td>
            <span class="badge">
                ${order.Service || "-"}
            </span>
        </td>

        <td>
            ${order.Message || "-"}
        </td>

        <td>

            <button
                class="btn-del"
                onclick="deleteOrder('${order.ID}')"
            >
                <i class="ph ph-trash"></i>
            </button>

        </td>
        `;

        tbody.appendChild(row);

    });

}

// SEARCH

function filterTable(){

    const value =
    document.getElementById(
        "searchInput"
    ).value.toLowerCase();

    const filtered = allOrders.filter(order => {

        return (

            order.Name?.toLowerCase().includes(value) ||

            order.Email?.toLowerCase().includes(value) ||

            order.Service?.toLowerCase().includes(value) ||

            order.ID?.toLowerCase().includes(value)

        );

    });

    renderTable(filtered);

}

// DELETE ORDER

async function deleteOrder(id){

    const confirmDelete =
    confirm(`Delete ${id}?`);

    if(!confirmDelete) return;

    try{

        const response = await fetch(
            APPS_SCRIPT_URL,
            {
                method:"POST",

                headers:{
                    "Content-Type":
                    "text/plain;charset=utf-8"
                },

                body:JSON.stringify({
                    action:"delete",
                    id:id
                })
            }
        );

        const result = await response.json();

        if(result.success){

            alert("Deleted Successfully");

            fetchOrders();

        } else {

            alert(
                result.error || "Delete Failed"
            );

        }

    } catch(error){

        console.log(error);

        alert("Network Error");

    }

}

// EXPORT CSV

function exportCSV(){

    if(allOrders.length===0){

        alert("No Data");

        return;
    }

    const headers =
    Object.keys(allOrders[0]).join(",");

    const rows = allOrders.map(order => {

        return Object.values(order)
        .map(value =>
            `"${String(value).replace(/"/g,'""')}"`
        )
        .join(",");

    });

    const csv =
    headers + "\n" + rows.join("\n");

    const blob = new Blob(
        [csv],
        {type:"text/csv"}
    );

    const url =
    URL.createObjectURL(blob);

    const a =
    document.createElement("a");

    a.href = url;

    a.download =
    "fenix_orders.csv";

    document.body.appendChild(a);

    a.click();

    document.body.removeChild(a);

}

</script>

</body>
</html>
